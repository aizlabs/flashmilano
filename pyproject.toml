[project]
name = "flashmilano"
version = "0.1.0"
description = "Italian learner article simplification pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langchain-anthropic>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "spacy>=3.7.0",
    "trafilatura>=1.6.0",
    "feedparser>=6.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "requests-cache>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "langdetect>=1.0.9",
    "it-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl",
    "boto3>=1.42.72",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.scripts]
flashmilano-manual = "scripts.manual_pipeline:main"
flashmilano-audio-post = "scripts.post_audio:main"
flashmilano-publish-source = "scripts.publish_source:main"
flashmilano-publish-and-push = "scripts.publish_and_push:main"
flashmilano-eval-glossary = "scripts.eval_glossary_llm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
